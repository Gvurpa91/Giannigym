  </defs>
  <rect width="660" height="190" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="657" height="187" rx="20.5" fill="none" stroke="#2b3140" stroke-width="3"/>
  <ellipse cx="128" cy="120" rx="110" ry="60" fill="url(#glow)"/>

  <!-- GG mark -->
  <text x="128" y="108" text-anchor="middle" font-family="Inter, 'Inter Display', -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="92" font-weight="900" letter-spacing="-6" fill="#ffffff">G<tspan fill="#c8ff2e">G</tspan></text>
  <rect x="58" y="140" width="140" height="12" rx="6" fill="url(#bar)"/>
  <rect x="54" y="132" width="14" height="28" rx="3" fill="#ffffff"/>
  <rect x="188" y="132" width="14" height="28" rx="3" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="250" y="92" font-family="Inter, 'Inter Display', -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="-2.5" fill="#ffffff">Gianni<tspan fill="#c8ff2e">Gym</tspan></text>
  <text x="252" y="128" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#c8ff2e">IL TUO PROGRAMMA · I TUOI DATI</text>
  <text x="252" y="154" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#9aa3b5">Programmi su misura · diario serie e pesi · progressione</text>
